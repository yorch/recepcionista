# Postgres for local development. Start: docker compose up -d
# The app reads DATABASE_URL from .env.local / .env.
services:
  db:
    image: postgres:17-alpine
    container_name: recepcionista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recepcionista
      POSTGRES_PASSWORD: recepcionista
      POSTGRES_DB: recepcionista
    ports:
      - "5433:5432"
    volumes:
      - recepcionista-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recepcionista -d recepcionista"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recepcionista-pgdata:
