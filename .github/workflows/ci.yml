name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recepcionista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recepcionista_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy value, the same approach the Dockerfile uses. Prisma generate
      # and the checks below never contact the database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src tests

      - name: Build
        # Catches server-only modules leaking into client bundles. Pages are
        # force-dynamic, so a dummy DATABASE_URL is enough.
        run: bunx next build
        env:
          ADMIN_TOKEN: ci-build-token
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Apply migrations to the test database
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recepcionista_test?schema=public

      - name: Test (unit + integration)
        # TEST_DATABASE_URL enables tests/integration and tests/db; the database name must contain "test".
        run: bun test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/recepcionista_test?schema=public
