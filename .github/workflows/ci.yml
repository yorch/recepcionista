name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy value, the same approach the Dockerfile uses. Prisma generate
      # and the checks below never contact the database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src tests

      - name: Build
        # Catches server-only modules leaking into client bundles. Pages are
        # force-dynamic, so a dummy DATABASE_URL is enough.
        run: bunx next build
        env:
          ADMIN_TOKEN: ci-build-token
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Test
        # tests/ is being added. Until it exists, this step passes with no tests.
        run: bun test --pass-with-no-tests
